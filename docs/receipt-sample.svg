<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="406" viewBox="0 0 480 406" role="img" aria-label="Spendlight receipt">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1c1610" flood-opacity="0.18"/>
    </filter>
    <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#c4a574" opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="480" height="406" fill="#d9cbb0"/>
  <rect x="24" y="18" width="432" height="370" rx="4" fill="#f7f0e1" filter="url(#shadow)"/>
  <rect x="24" y="18" width="432" height="10" fill="url(#dots)"/>
  <text x="240" y="58" text-anchor="middle" class="brand">SPENDLIGHT</text>
  <text x="240" y="80" text-anchor="middle" class="sub">spend receipt</text>
  <path d="M48 96 H432" stroke="#1c1610" stroke-opacity="0.2" stroke-dasharray="3 5"/>
  <text x="48" y="122" class="muted">generated</text>
  <text x="432" y="122" class="item amount">2026-09-16 20:18:03Z</text>
  <text x="48" y="144" class="muted">status</text>
  <text x="432" y="144" class="item amount">OK</text>
  <path d="M48 158 H432" stroke="#1c1610" stroke-opacity="0.2" stroke-dasharray="3 5"/>
  <text x="36" y="184" class="item">gpt-4o</text>
            <text x="444" y="184" class="item amount">$0.0192</text>
<text x="36" y="206" class="item">gpt-5-mini</text>
            <text x="444" y="206" class="item amount">$0.004400</text>
<text x="36" y="228" class="item">gpt-4.1-mini</text>
            <text x="444" y="228" class="item amount">$0.001840</text>
<text x="36" y="250" class="item">gpt-4o-mini</text>
            <text x="444" y="250" class="item amount">$0.000444</text>
  <path d="M48 274 H432" stroke="#1c1610" stroke-opacity="0.35"/>
  <text x="48" y="304" class="total-label">TOTAL</text>
  <text x="432" y="304" class="total amount">$0.0259</text>
  <text x="48" y="332" class="muted">requests 4 · tokens 18,700</text>
  <text x="48" y="354" class="muted">hard budget $50.00</text>
  <text x="240" y="378" text-anchor="middle" class="footer">keep the light on · estimates only</text>
  <style>
    .brand { font: 700 22px "Palatino Linotype", Palatino, "Times New Roman", serif; fill: #1c1610; letter-spacing: 6px; }
    .sub { font: italic 13px "Palatino Linotype", Palatino, serif; fill: #7a6a50; letter-spacing: 3px; }
    .item { font: 13px ui-monospace, "SF Mono", Menlo, monospace; fill: #1c1610; }
    .muted { font: 11px ui-monospace, "SF Mono", Menlo, monospace; fill: #7a6a50; }
    .amount { text-anchor: end; }
    .total { font: 700 20px ui-monospace, "SF Mono", Menlo, monospace; fill: #1c1610; text-anchor: end; }
    .total-label { font: 700 13px ui-sans-serif, system-ui, sans-serif; fill: #1c1610; letter-spacing: 3px; }
    .footer { font: italic 11px "Palatino Linotype", Palatino, serif; fill: #7a6a50; }
  </style>
</svg>