services:
  spendlight:
    build: .
    ports:
      # Host bind is localhost-only. The container still listens on 0.0.0.0 inside the netns.
      - "127.0.0.1:8787:8787"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      SPENDLIGHT_SOFT_BUDGET_USD: ${SPENDLIGHT_SOFT_BUDGET_USD:-10}
      SPENDLIGHT_HARD_BUDGET_USD: ${SPENDLIGHT_HARD_BUDGET_USD:-25}
      SPENDLIGHT_HOST: 0.0.0.0
    volumes:
      - spendlight-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  spendlight-data:
